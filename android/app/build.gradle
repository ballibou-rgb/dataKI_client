plugins {
    id 'com.android.application'
}

android {
    namespace 'ovh.datanet.dataki.client'
    compileSdk 34

    defaultConfig {
        applicationId "ovh.datanet.dataki.client"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Host used for App-Links login redirect (see AndroidManifest + docs §5).
        manifestPlaceholders = [datakiHost: "ai.datanet.ovh"]
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Login: Custom Tabs for the browser hand-off + App-Links.
    implementation 'androidx.browser:browser:1.8.0'
    // Device-key storage (encrypted) — see core/SecretStore.java.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // HTTP for exchange / bootstrap / chat.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}
