# Meson cross file for building the Windows client from Linux with mingw-w64.
#
# Requires the mingw-w64 toolchain and the mingw GTK3 stack (gtk3, gtksourceview3,
# curl, json-glib, md4c) to be available for the x86_64-w64-mingw32 target, e.g.
# via Fedora's mingw64-* packages or an MSYS2 sysroot exposed through
# PKG_CONFIG_PATH / PKG_CONFIG_SYSROOT_DIR.
#
# On CI we build Windows natively under MSYS2 instead (see .github/workflows/
# release.yml), which is more reliable; this cross file is for local Linux builds.

[binaries]
c          = 'x86_64-w64-mingw32-gcc'
cpp        = 'x86_64-w64-mingw32-g++'
ar         = 'x86_64-w64-mingw32-ar'
strip      = 'x86_64-w64-mingw32-strip'
windres    = 'x86_64-w64-mingw32-windres'
pkg-config = 'x86_64-w64-mingw32-pkg-config'

[host_machine]
system     = 'windows'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'

[properties]
# Point this at your mingw GTK3 sysroot if pkg-config needs it:
# sys_root = '/usr/x86_64-w64-mingw32/sys-root/mingw'
