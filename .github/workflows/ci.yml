name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  desktop-linux:
    name: Desktop (Linux build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build build-essential pkg-config gettext \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Configure
        working-directory: desktop
        run: meson setup build --buildtype=release

      - name: Compile
        working-directory: desktop
        run: meson compile -C build

      - name: Test
        working-directory: desktop
        run: meson test -C build --print-errorlogs

  android:
    name: Android (assemble + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble debug + run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug test --no-daemon --stacktrace
