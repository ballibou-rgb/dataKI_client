name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (.deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build build-essential pkg-config gettext \
            libgtk-3-dev libayatana-appindicator3-dev \
            libcurl4-openssl-dev libjson-glib-dev libsecret-1-dev \
            desktop-file-utils fuse zip wget file

      - name: Fetch AppImage tooling
        run: |
          cd /usr/local/bin
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk.sh
          sudo wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage linuxdeploy
          sudo mv appimagetool-x86_64.AppImage appimagetool
          sudo mv linuxdeploy-plugin-gtk.sh linuxdeploy-plugin-gtk
          sudo chmod +x linuxdeploy appimagetool linuxdeploy-plugin-gtk

      - name: Build Linux artifacts
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./build.sh linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: desktop/dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  windows:
    name: Windows (NSIS setup + portable zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-ntldd

      - name: Build Windows artifacts
        working-directory: desktop
        run: ./build.sh windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: desktop/dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
